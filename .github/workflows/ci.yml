name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: build, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake g++ \
            libopus-dev libasound2-dev libssl-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libpipewire-0.3-dev libspa-0.2-dev pipewire libva-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace -- --test-threads=8
