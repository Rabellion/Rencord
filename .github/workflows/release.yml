name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p rencord-desktop -p rencord-media
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Rencord"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release"
          Copy-Item (Join-Path $bin "rencord.exe") (Join-Path $stage "Rencord.exe")
          Copy-Item (Join-Path $bin "rencord-stream.exe") (Join-Path $stage "rencord-stream.exe")
          Get-ChildItem $bin -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $stage $_.Name)
          }
          Copy-Item LICENSE-MIT (Join-Path $stage "LICENSE-MIT")
          Copy-Item LICENSE-APACHE (Join-Path $stage "LICENSE-APACHE")
          $tag = $env:GITHUB_REF_NAME
          @"
          Rencord $tag, a Windows x64 test build for the owner.

          Unofficial client. Discord's terms can end the account.
          This build is unsigned, so SmartScreen will warn.

          Rencord.exe is the window. rencord-stream.exe sits next to it for the Go Live worker.
          Any DLL in this folder was copied from the build because the exe loads it.
          OpenH264 is compiled into the exe. ffmpeg is optional and is used only when it is on PATH.
          The Discord login page needs the WebView2 runtime, which current Windows installs already include.

          Try QR login, the Discord login page, the email fallback, keychain sessions, Onyx Ink, themes, the Appearance page, a resized window, the big-file sheet, and the HDR tone-map row.

          Not wired yet: sending a real Go Live stream, hardware and 10-bit encode, live Discord voice, threads, notifications, and the tray.
          "@ | Set-Content -Encoding utf8 (Join-Path $stage "README.txt")
          $sums = Get-ChildItem $stage -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          }
          $sums | Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")
          $zipName = "Rencord-$tag-windows-x64.zip"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist\$zipName"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "{0}  {1}" -f $zipHash, $zipName | Set-Content -Encoding ascii (Join-Path $env:GITHUB_WORKSPACE "dist\SHA256SUMS.txt")
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rencord ${{ github.ref_name }} (test build)
          prerelease: true
          make_latest: false
          files: |
            dist/Rencord-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
          body: |
            Test build for the owner. Windows x64 only. Unsigned, so SmartScreen will warn. Unofficial client: Discord's terms can end the account.

            Try QR login, the Discord login page, the email fallback, keychain sessions, Onyx Ink, themes, the Appearance page, a resized window, the big-file sheet, and the HDR tone-map row. The Discord login page needs the WebView2 runtime.

            Not wired: sending a real Go Live stream, hardware and 10-bit encode, live Discord voice, threads, notifications, and the tray. ffmpeg is optional and is used only when it is on PATH.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
