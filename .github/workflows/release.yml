name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          $env:CFLAGS = "/MT"
          $env:CXXFLAGS = "/MT"
          cargo build --release --locked --target x86_64-pc-windows-msvc -p rencord-desktop --bin rencord
      - name: Sign, package, and smoke-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $built = Join-Path $root "target\x86_64-pc-windows-msvc\release\rencord.exe"
          $exe = Join-Path $dist "Rencord.exe"
          Copy-Item $built $exe
          if (Test-Path (Join-Path $root "target\x86_64-pc-windows-msvc\release\rencord-stream.exe")) {
            throw "the release build produced rencord-stream.exe"
          }

          $kits = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kits) { throw "signtool.exe was not found" }
          $signtool = $kits.FullName
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found" }

          $pfx = Join-Path $dist "signing.pfx"
          $cer = Join-Path $dist "Rencord-signing.cer"
          $selfSigned = $false
          if ($env:WINDOWS_CERT_PFX_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $password = $env:WINDOWS_CERT_PASSWORD
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Export-Certificate -Cert $imported -FilePath $cer | Out-Null
            Write-Host "Using the certificate from repository secrets."
          } else {
            $selfSigned = $true
            $password = "RencordSelfSigned"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Rabellion" -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(3)
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Write-Host "No signing secret was set. Generated a self-signed CN=Rabellion certificate."
          }

          function Sign-Binary([string]$Path) {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $password $Path
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $Path" }
          }

          Sign-Binary $exe
          $signCmd = "`$q$signtool`$q sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `$q$pfx`$q /p `$q$password`$q `$f"
          & $iscc "/Srencord=$signCmd" "/DExeSource=$exe" "/O$dist" (Join-Path $root "packaging\windows\rencord.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = Join-Path $dist "Rencord-v0.6.0-setup-x64.exe"
          if (-not (Test-Path $setup)) { throw "setup exe missing" }

          if ($selfSigned) {
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
          }
          function Show-Signature([string]$Path) {
            Write-Host "---- signature $Path"
            & $signtool verify /pa /tw $Path
            if ($LASTEXITCODE -ne 0) { throw "verify failed for $Path" }
            $info = Get-AuthenticodeSignature $Path
            Write-Host ("Status={0} Subject={1} Timestamp={2}" -f $info.Status, $info.SignerCertificate.Subject, $(if ($info.TimeStamperCertificate) { $info.TimeStamperCertificate.Subject } else { "missing" }))
            if (-not $info.TimeStamperCertificate) { throw "missing timestamp on $Path" }
          }
          Show-Signature $exe
          Show-Signature $setup

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Rencord"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$installDir"
          if ($LASTEXITCODE -ne 0) { throw "silent install failed: $LASTEXITCODE" }
          $installed = Join-Path $installDir "Rencord.exe"
          if (-not (Test-Path $installed)) { throw "installed exe missing" }
          if (Test-Path (Join-Path $installDir "rencord-stream.exe")) { throw "installer laid down rencord-stream.exe" }
          & $installed --worker-check
          if ($LASTEXITCODE -ne 0) { throw "worker-check failed" }
          $bannerPath = Join-Path $dist "worker-banner.txt"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $installed
          $psi.Arguments = "--stream-worker"
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $worker = [Diagnostics.Process]::Start($psi)
          $read = $worker.StandardOutput.ReadLineAsync()
          $banner = ""
          if ($read.Wait(15000)) { $banner = $read.Result }
          if (-not $worker.HasExited) { $worker.Kill() }
          if ($banner -notmatch "RENCORD_STREAM") { throw "installed exe did not enter stream worker mode: $banner" }
          $unins = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "uninstaller missing" }
          Show-Signature $unins.FullName
          & $unins.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "silent uninstall failed: $LASTEXITCODE" }
          if (Test-Path $installed) { throw "uninstall left Rencord.exe behind" }
          Write-Host "SMOKE_OK install worker-check stream-worker uninstall"

          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $lines = @("{0}  Rencord-v0.6.0-setup-x64.exe" -f $hash)
          $files = @($setup)
          if ($selfSigned) { $files += $cer }
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $digest = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($name -ne "Rencord-v0.6.0-setup-x64.exe") {
              $lines += "{0}  {1}" -f $digest, $name
            }
          }
          $sums = Join-Path $dist "SHA256SUMS.txt"
          $lines | Set-Content -Encoding ascii $sums
          @"
          Test build for the owner. Windows x64 installer. Unofficial client: Discord's terms can end the account.

          Since v0.5.0: UDP discovery retries a dropped probe and ignores a garbage datagram, for voice and Go Live. The Go Live worker is the same Rencord.exe, started again with --stream-worker, so the installer does not ship rencord-stream.exe. A QR ticket exchange keeps Discord's reply when it fails.

          The setup installs per user to %LOCALAPPDATA%\Programs\Rencord unless you choose an all-users install. It adds a Start Menu shortcut, an optional desktop shortcut, and an uninstaller. The uninstaller asks before deleting user data in %APPDATA%.

          Signing: $(if ($selfSigned) { "self-signed certificate, subject CN=Rabellion, SHA-256, timestamped by http://timestamp.digicert.com. SmartScreen can still warn. Choose More info, then Run anyway. Real trust needs an OV or EV certificate, or Azure Trusted Signing. Rencord-signing.cer is attached if you want to trust this build locally." } else { "signed with the repository certificate, SHA-256, timestamped by http://timestamp.digicert.com." })

          SHA-256 of Rencord-v0.6.0-setup-x64.exe: $hash
          "@ | Set-Content -Encoding utf8 (Join-Path $dist "notes.md")
          Remove-Item $pfx -Force
          Remove-Item $exe -Force
          Remove-Item $bannerPath -Force -ErrorAction SilentlyContinue
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rencord v0.6.0 (test build)
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: dist/notes.md
          files: |
            dist/Rencord-v0.6.0-setup-x64.exe
            dist/SHA256SUMS.txt
            dist/Rencord-signing.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
