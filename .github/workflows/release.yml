name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw "Cargo.toml has no version" }
          Set-Content -Path dist-version.txt -Value $version -Encoding ascii
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $($env:GITHUB_REF_NAME) does not match v$version"
          }
          Write-Host "version $version"
      - name: Build
        timeout-minutes: 20
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          $env:CFLAGS = "/MT"
          $env:CXXFLAGS = "/MT"
          cargo build --release --locked --target x86_64-pc-windows-msvc -p rencord-desktop --bin rencord
      - name: Sign
        timeout-minutes: 15
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "packaging\windows\bounded.ps1")
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $built = Join-Path $root "target\x86_64-pc-windows-msvc\release\rencord.exe"
          $exe = Join-Path $dist "Rencord.exe"
          Copy-Item $built $exe
          if (Test-Path (Join-Path $root "target\x86_64-pc-windows-msvc\release\rencord-stream.exe")) {
            throw "the release build produced rencord-stream.exe"
          }
          $kits = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kits) { throw "signtool.exe was not found" }
          $signtool = $kits.FullName
          $pfx = Join-Path $dist "signing.pfx"
          $cer = Join-Path $dist "Rencord-signing.cer"
          if ($env:WINDOWS_CERT_PFX_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $password = $env:WINDOWS_CERT_PASSWORD
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Export-Certificate -Cert $imported -FilePath $cer | Out-Null
            Write-Host "Using the certificate from repository secrets."
          } else {
            $password = "RencordSelfSigned"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Rabellion" -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(3)
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Set-Content -Path (Join-Path $dist "self-signed.txt") -Value "yes" -Encoding ascii
            Write-Host "No signing secret was set. Generated a self-signed CN=Rabellion certificate."
          }
          $env:RENCORD_PFX = $pfx
          $env:RENCORD_PFX_PASSWORD = $password
          $env:RENCORD_SIGNTOOL = $signtool
          $env:RENCORD_TIMESTAMP_FILE = Join-Path $dist "timestamp-server.txt"
          Invoke-Bounded -File (Get-Command pwsh).Source -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            (Join-Path $root "packaging\windows\sign.ps1"), $exe
          ) -TimeoutSec 240 -Label "sign Rencord.exe"
          Write-Host "signed Rencord.exe via $((Get-Content $env:RENCORD_TIMESTAMP_FILE -Raw).Trim())"
      - name: Package
        timeout-minutes: 15
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "packaging\windows\bounded.ps1")
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $version = Get-Content (Join-Path $root "dist-version.txt") -Raw
          $version = $version.Trim()
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $env:RENCORD_PFX = Join-Path $dist "signing.pfx"
          $env:RENCORD_PFX_PASSWORD = if (Test-Path (Join-Path $dist "self-signed.txt")) { "RencordSelfSigned" } else { $env:WINDOWS_CERT_PASSWORD }
          $env:RENCORD_SIGNTOOL = $signtool
          $env:RENCORD_TIMESTAMP_FILE = Join-Path $dist "timestamp-server.txt"
          $signCmd = Join-Path $root "packaging\windows\sign-inno.cmd"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $exePath = Join-Path $dist "Rencord.exe"
          $iss = Join-Path $root "packaging\windows\rencord.iss"
          $quad = $version + ".0"
          $isccArgs = '/Srencord="' + $signCmd + ' $f" /DExeSource="' + $exePath + '" /DMyAppVersion=' + $version + ' /DVersionQuad=' + $quad + ' /O"' + $dist + '" "' + $iss + '"'
          Invoke-Bounded -File $iscc -ArgumentString $isccArgs -TimeoutSec 720 -Label "Inno Setup"
          $setup = Join-Path $dist "Rencord-v$version-setup-x64.exe"
          if (-not (Test-Path $setup)) { throw "setup exe missing: $setup" }
          Write-Host "packaged $setup"
      - name: Smoke-test
        timeout-minutes: 15
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "packaging\windows\bounded.ps1")
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $version = (Get-Content (Join-Path $root "dist-version.txt") -Raw).Trim()
          $setup = Join-Path $dist "Rencord-v$version-setup-x64.exe"
          $exe = Join-Path $dist "Rencord.exe"
          $cer = Join-Path $dist "Rencord-signing.cer"
          $selfSigned = Test-Path (Join-Path $dist "self-signed.txt")
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $server = (Get-Content (Join-Path $dist "timestamp-server.txt") -Raw).Trim()
          if ($selfSigned) {
            # Import-Certificate opens a trust dialog. certutil -f does not.
            Invoke-Bounded -File certutil.exe -ArgumentList @("-user", "-f", "-addstore", "Root", $cer) -TimeoutSec 30 -Label "trust the signing cert"
            Invoke-Bounded -File certutil.exe -ArgumentList @("-user", "-f", "-addstore", "TrustedPublisher", $cer) -TimeoutSec 30 -Label "trust the signing cert for Authenticode"
          }
          function Show-Signature([string]$Path) {
            Write-Host "---- signature $Path"
            Invoke-Bounded -File $signtool -ArgumentList @("verify", "/pa", "/tw", $Path) -TimeoutSec 60 -Label "verify $Path"
            $info = Get-AuthenticodeSignature $Path
            $stamp = if ($info.TimeStamperCertificate) { $info.TimeStamperCertificate.Subject } else { "missing" }
            Write-Host ("Status={0} Subject={1} Timestamp={2}" -f $info.Status, $info.SignerCertificate.Subject, $stamp)
            if (-not $info.TimeStamperCertificate) { throw "missing timestamp on $Path" }
          }
          Show-Signature $exe
          Show-Signature $setup
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Rencord"
          Invoke-Bounded -File $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -TimeoutSec 180 -Label "silent install"
          $installed = Join-Path $installDir "Rencord.exe"
          if (-not (Test-Path $installed)) { throw "installed exe missing" }
          if (Test-Path (Join-Path $installDir "rencord-stream.exe")) { throw "installer laid down rencord-stream.exe" }
          $checkOut = Join-Path $dist "worker-check.txt"
          Invoke-Bounded -File $installed -ArgumentList @("--worker-check") -TimeoutSec 20 -Label "worker-check" -RedirectStandardOutput $checkOut
          $checkText = Get-Content $checkOut -Raw
          if ($checkText -notmatch "WORKER_CHECK") { throw "worker-check did not print its banner: $checkText" }
          $bannerPath = Join-Path $dist "worker-banner.txt"
          $worker = Start-Process -FilePath $installed -ArgumentList @("--stream-worker") -PassThru -NoNewWindow -RedirectStandardOutput $bannerPath
          $null = Wait-Process -Id $worker.Id -Timeout 20 -ErrorAction SilentlyContinue
          $banner = ""
          if (Test-Path $bannerPath) { $banner = Get-Content $bannerPath -Raw -ErrorAction SilentlyContinue }
          if (-not $worker.HasExited) { & taskkill.exe /F /T /PID $worker.Id | Out-Null }
          if ($banner -notmatch "RENCORD_STREAM") { throw "installed exe did not enter stream worker mode: $banner" }
          $unins = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "uninstaller missing" }
          Show-Signature $unins.FullName
          Invoke-Bounded -File $unins.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -TimeoutSec 180 -Label "silent uninstall"
          if (Test-Path $installed) { throw "uninstall left Rencord.exe behind" }
          Write-Host "SMOKE_OK install worker-check stream-worker uninstall"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $lines = @("{0}  Rencord-v$version-setup-x64.exe" -f $hash)
          if ($selfSigned) {
            $lines += "{0}  Rencord-signing.cer" -f (Get-FileHash $cer -Algorithm SHA256).Hash.ToLower()
          }
          $lines | Set-Content -Encoding ascii (Join-Path $dist "SHA256SUMS.txt")
          $signing = if ($selfSigned) {
            "self-signed certificate, subject CN=Rabellion, SHA-256, timestamped by $server. SmartScreen can still warn. Choose More info, then Run anyway. Real trust needs an OV or EV certificate, or Azure Trusted Signing. Rencord-signing.cer is attached if you want to trust this build locally."
          } else {
            "signed with the repository certificate, SHA-256, timestamped by $server."
          }
          @"
          Test build for the owner. Windows x64 installer. Unofficial client: Discord's terms can end the account.

          Since v0.5.0: UDP discovery retries a dropped probe and ignores a garbage datagram, for voice and Go Live. The Go Live worker is the same Rencord.exe, started again with --stream-worker, and this build is an installer rather than a loose zip. A QR ticket exchange keeps Discord's reply when it fails. The login window can show an hCaptcha panel in the app. The audit pass keeps the gateway up across short drops and rate limits, and checks the full RTP header.

          The setup installs per user to %LOCALAPPDATA%\Programs\Rencord unless you choose an all-users install. It adds a Start Menu shortcut, an optional desktop shortcut, and an uninstaller. The uninstaller asks before deleting user data in %APPDATA%, and a silent uninstall keeps that data.

          Signing: $signing

          SHA-256 of Rencord-v$version-setup-x64.exe: $hash
          "@ | Set-Content -Encoding utf8 (Join-Path $dist "notes.md")
          Remove-Item (Join-Path $dist "signing.pfx") -Force -ErrorAction SilentlyContinue
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rencord v0.6.0 (test build)
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: dist/notes.md
          files: |
            dist/Rencord-v0.6.0-setup-x64.exe
            dist/SHA256SUMS.txt
            dist/Rencord-signing.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
