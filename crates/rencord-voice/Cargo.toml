[package]
name = "rencord-voice"
version = "0.1.0"
description = "Discord voice session, DAVE, and the adaptive jitter buffer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
cpal = ["dep:cpal"]

[dependencies]
audiopus.workspace = true
chacha20poly1305.workspace = true
davey.workspace = true
rencord-model.workspace = true
rencord-protocol.workspace = true
serde_json.workspace = true
thiserror.workspace = true
cpal = { version = "0.15", optional = true }

[dev-dependencies]
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
