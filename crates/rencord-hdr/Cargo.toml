[package]
name = "rencord-hdr"
version = "0.1.0"
description = "HDR capture probes, 10-bit encode contracts, tone-mapping, and Rencord-to-Rencord signalling"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flate2.workspace = true
pollster = "0.4"
serde_json.workspace = true
thiserror.workspace = true
wgpu = "30"

[dev-dependencies]
naga = { version = "25", default-features = false, features = ["wgsl-in"] }

[[bench]]
name = "throughput"
harness = false

[[bin]]
name = "hdr-compare"
path = "src/bin/compare.rs"
