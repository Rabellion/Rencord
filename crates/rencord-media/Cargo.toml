[package]
name = "rencord-media"
version.workspace = true
description = "Go Live capture, shared-memory frames, and the stream worker"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rencord-stream"
path = "src/bin/rencord-stream.rs"

[dependencies]
memmap2 = "0.9"
openh264 = "0.8"
rencord-hdr.workspace = true
rencord-model.workspace = true
rencord-protocol.workspace = true
rencord-voice.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D11",
    "Win32_Foundation",
    "Graphics_Capture",
    "Foundation",
] }
