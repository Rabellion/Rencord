[package]
name = "rencord-desktop"
version = "0.1.0"
description = "GPUI desktop shell for Rencord"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rencord"
path = "src/main.rs"

[[bin]]
name = "rencord-measure"
path = "src/measure.rs"

[dependencies]
async-channel.workspace = true
gpui-kit.workspace = true
rencord-api.workspace = true
rencord-auth = { workspace = true, features = ["webview"] }
rencord-gateway.workspace = true
rencord-markdown.workspace = true
rencord-hdr.workspace = true
rencord-media.workspace = true
rencord-model.workspace = true
rencord-platform.workspace = true
rencord-theme.workspace = true
rencord-store.workspace = true
rencord-upload.workspace = true
rencord-voice = { workspace = true, features = ["cpal"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
image = { version = "0.25.1", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3.0.12"

[package.metadata.bundle]
name = "Rencord"
identifier = "app.rencord.desktop"
icon = ["../../assets/brand/hexwave.icns"]
short_description = "Native Discord client"
long_description = "A native Discord desktop client in Rust. The interface is GPUI."

[package.metadata.packager]
product-name = "Rencord"
identifier = "app.rencord.desktop"
icons = [
    "../../assets/brand/hexwave.icns",
    "../../assets/brand/hexwave.ico",
    "../../assets/brand/hexwave-icon-1024.png",
]
