[workspace]
resolver = "2"
members = [
    "crates/rencord-model",
    "crates/rencord-protocol",
    "crates/rencord-api",
    "crates/rencord-gateway",
    "crates/rencord-store",
    "crates/rencord-markdown",
    "crates/rencord-voice",
    "crates/rencord-media",
    "crates/rencord-hdr",
    "crates/rencord-platform",
    "crates/rencord-upload",
    "apps/rencord-desktop",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Rabellion <100542120+Rabellion@users.noreply.github.com>"]
repository = "https://github.com/Rabellion/Rencord"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
audiopus = "0.2"
chacha20poly1305 = "0.10"
davey = "0.2"
async-channel = "2"
flate2 = "1"
gpui-kit = "0.10"

rencord-model = { path = "crates/rencord-model" }
rencord-protocol = { path = "crates/rencord-protocol" }
rencord-api = { path = "crates/rencord-api" }
rencord-gateway = { path = "crates/rencord-gateway" }
rencord-store = { path = "crates/rencord-store" }
rencord-markdown = { path = "crates/rencord-markdown" }
rencord-voice = { path = "crates/rencord-voice" }
rencord-media = { path = "crates/rencord-media" }
rencord-hdr = { path = "crates/rencord-hdr" }
rencord-platform = { path = "crates/rencord-platform" }
rencord-upload = { path = "crates/rencord-upload" }
